<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%2300D4FF'/%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%2300D4FF' stroke-opacity='.35' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{ --void:#0A0A0F; --matter:#EEF0F4; --cyan:#00D4FF; --cyan-active:#00E5FF; --dim:rgba(238,240,244,.64); --line:rgba(238,240,244,.10); }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ background:var(--void); }
  body{
    color:var(--matter); font-family:'Space Grotesk',system-ui,-apple-system,Segoe UI,sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh; min-height:100dvh; overflow-x:hidden;
    display:flex; flex-direction:column; overscroll-behavior-y:none;
  }

  /* slim sticky back bar — the escape hatch, always in reach, safe-area aware */
  .bar{
    position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:calc(11px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 11px max(16px,env(safe-area-inset-left));
    background:rgba(10,10,15,.9); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
  }
  .back{ display:inline-flex; align-items:center; gap:8px; color:var(--matter); text-decoration:none; font-size:14px; font-weight:600; }
  .back:hover{ color:var(--cyan-active); }
  .back .arrow{ font-size:18px; line-height:1; }
  .mark{ display:inline-flex; align-items:center; gap:8px; font-size:11px; font-weight:700; letter-spacing:.24em; text-transform:uppercase; color:var(--dim); text-decoration:none; }
  .mark:hover{ color:var(--cyan-active); }
  .mark .signal{ width:9px; height:9px; border-radius:50%; background:var(--cyan); box-shadow:0 0 12px rgba(0,212,255,.8); }

  main{ flex:1; width:100%; max-width:1000px; margin:0 auto; padding:20px 16px 8px; position:relative; }
  .lead{ text-align:center; margin:4px 0 16px; }
  .lead h1{ font-size:clamp(22px,5.4vw,30px); font-weight:700; letter-spacing:-.02em; line-height:1.12; }
  .lead p{ margin-top:8px; color:var(--dim); font-size:15px; max-width:520px; margin-left:auto; margin-right:auto; }
  .lead strong{ color:var(--matter); font-weight:600; }

  .shell{
    position:relative; border-radius:16px; overflow:hidden; background:#FFFFFF; min-height:780px;
    border:1px solid rgba(0,212,255,.22); box-shadow:0 20px 70px rgba(0,0,0,.5), 0 0 60px rgba(0,212,255,.06);
  }
  .shell::before{ content:"Loading your calendar…"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#5A6472; font-size:15px; }
  .shell iframe{ position:relative; display:block; width:100%; border:none; min-height:780px; }

  .alt{ text-align:center; color:var(--dim); font-size:14px; margin:16px auto 0; max-width:480px; }
  .alt a{ color:var(--cyan); font-weight:600; text-decoration:none; white-space:nowrap; }
  .alt a:hover{ color:var(--cyan-active); }

  footer{ text-align:center; color:var(--dim); font-size:13px; margin-top:24px; padding:22px 16px calc(24px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); }
  footer a{ color:var(--cyan); text-decoration:none; }
  footer a:hover{ color:var(--cyan-active); }

  @media(min-width:768px){
    .bar{ padding-left:max(24px,env(safe-area-inset-left)); padding-right:max(24px,env(safe-area-inset-right)); }
    .shell,.shell iframe{ min-height:840px; }
  }
</style>
<script src="/js/tracking.js" async></script>
</head>
<body>

<header class="bar">
  <a class="back" href="/"><span class="arrow" aria-hidden="true">←</span> Back to AI Voice Agency</a>
  <a class="mark" href="/"><span class="signal" aria-hidden="true"></span>AVA</a>
</header>

<main>
  <div class="lead">
    <h1>Book your AVA demo</h1>
    <p><strong>20 minutes, live on your line.</strong> Pick a slot — we call you, so you hear AVA exactly the way your callers will.</p>
  </div>
  <div class="shell">
    <iframe src="https://api.leadconnectorhq.com/widget/booking/aCIv7rUnCGrysobt6Mlg"
      style="width:100%;border:none;min-height:780px" scrolling="no"
      id="aCIv7rUnCGrysobt6Mlg_booking" title="AVA demo scheduling calendar"></iframe>
  </div>
  <p class="alt">Want to hear AVA before you pick a time? Call the live demo line — <a href="tel:+14142408930">414-240-8930</a>.</p>
</main>

<footer>AI Voice Agency &middot; <a href="/">aivoiceagency.ai</a></footer>

<script src="https://link.msgsndr.com/js/form_embed.js"></script>
</body>
</html>
