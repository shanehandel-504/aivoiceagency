<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>100X · Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --void:#0A0A0F; --void-2:#14141C; --void-3:#1F1F2B; --void-4:#2A2A38;
    --text:#EEF0F4; --text-dim:#8A8A99;
    --cyan:#00D4FF; --cyan-active:#00E5FF;
    --green:#00FF88; --red:#FF3B5C;
  }
  html, body {
    background: var(--void); color: var(--text);
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  body { min-height: 100vh; padding: 16px 16px 48px; max-width: 560px; margin: 0 auto; }

  /* HEADER */
  .header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-bottom: 20px; padding-bottom: 14px;
    border-bottom: 1px solid var(--void-3);
  }
  .wordmark {
    font-size: 24px; font-weight: 700; letter-spacing: 0.04em;
    color: var(--cyan); text-shadow: 0 0 22px rgba(0, 212, 255, 0.45);
  }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .clock {
    font-size: 12px; color: var(--text-dim);
    letter-spacing: 0.06em; font-variant-numeric: tabular-nums;
    text-align: right;
  }
  .status-dot {
    width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
    background: var(--void-4); border: 1px solid var(--text-dim);
  }
  .status-dot[data-state="running"] {
    background: var(--cyan); border-color: var(--cyan);
    box-shadow: 0 0 12px var(--cyan); animation: pulse 1.2s infinite;
  }
  .status-dot[data-state="ok"] {
    background: var(--green); border-color: var(--green);
    box-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
  }
  .status-dot[data-state="failed"] {
    background: var(--red); border-color: var(--red);
    box-shadow: 0 0 10px rgba(255, 59, 92, 0.6);
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.8); }
  }

  /* LOOP TILE */
  .tile {
    background: var(--void-2); border: 1px solid var(--void-3);
    border-radius: 14px; padding: 18px; margin-bottom: 18px;
  }
  .tile-top {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; margin-bottom: 14px;
  }
  .tile h2 {
    font-size: 14px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--text);
  }
  .state {
    font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-dim);
  }
  .tile[data-state="running"] .state { color: var(--cyan-active); }
  .tile[data-state="ok"]      .state { color: var(--green); }
  .tile[data-state="failed"]  .state { color: var(--red); }
  .test-banner {
    display: none; margin-bottom: 14px; padding: 8px 10px;
    border: 1px dashed rgba(0, 212, 255, 0.4); border-radius: 8px;
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--cyan);
  }
  .test-banner.show { display: block; }
  .run-btn {
    width: 100%; padding: 18px; border: none; border-radius: 10px;
    background: var(--cyan); color: var(--void);
    font-family: inherit; font-size: 17px; font-weight: 700;
    letter-spacing: 0.16em; text-transform: uppercase;
    cursor: pointer; transition: background 0.15s, box-shadow 0.15s, opacity 0.15s;
  }
  .run-btn:hover:not(:disabled) {
    background: var(--cyan-active); box-shadow: 0 0 24px rgba(0, 212, 255, 0.4);
  }
  .run-btn:active:not(:disabled) { transform: translateY(1px); }
  .run-btn:disabled { opacity: 0.45; cursor: default; }

  /* RUN LOG */
  .panel {
    background: var(--void-2); border: 1px solid var(--void-3);
    border-radius: 14px; padding: 18px;
  }
  .panel h2 {
    font-size: 12px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--text-dim); margin-bottom: 12px;
  }
  .empty { font-size: 13px; color: var(--text-dim); }
  .log-row {
    display: flex; align-items: baseline; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid var(--void-3);
    font-size: 13px; line-height: 1.4;
  }
  .log-row:last-child { border-bottom: none; }
  .log-time { color: var(--text-dim); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .log-dur  { color: var(--text); font-variant-numeric: tabular-nums; flex-shrink: 0; min-width: 38px; }
  .badge {
    flex-shrink: 0; padding: 2px 8px; border-radius: 999px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
  }
  .badge.ok     { color: var(--green); border: 1px solid rgba(0, 255, 136, 0.4); }
  .badge.failed { color: var(--red);   border: 1px solid rgba(255, 59, 92, 0.4); }
  .log-summary { color: var(--text-dim); overflow-wrap: anywhere; }
</style>
</head>
<body>

<header class="header">
  <div class="wordmark">100X</div>
  <div class="header-right">
    <div class="clock" id="clock">—</div>
    <div class="status-dot" id="statusDot" data-state="idle"></div>
  </div>
</header>

<section class="tile" id="tile" data-state="idle">
  <div class="tile-top">
    <h2>Lead Response</h2>
    <span class="state" id="stateLabel">Idle</span>
  </div>
  <div class="test-banner" id="testBanner">Test mode — no live loop</div>
  <button class="run-btn" id="runBtn" type="button">Run</button>
</section>

<section class="panel">
  <h2>Run Log</h2>
  <div id="runLog"></div>
</section>

<script>
// CONFIG — the ONLY place a URL lives
const N8N_WEBHOOK_URL = "https://circulant.app.n8n.cloud/webhook/100x-lead-response";
const LOOP_NAME = "lead-response";

const LOG_KEY = "ai100x_runlog_v1";
const LOG_MAX = 50;
const TIMEOUT_MS = 15000;
// Test mode until a real webhook URL is pasted into CONFIG above.
const TEST_MODE = !/^https?:\/\//i.test(N8N_WEBHOOK_URL);

const $ = (id) => document.getElementById(id);

/* ---------- clock ---------- */
function tickClock() {
  const now = new Date();
  $("clock").textContent =
    now.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }) +
    " · " +
    now.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}
tickClock();
setInterval(tickClock, 1000);

/* ---------- state ---------- */
function setState(state) {
  $("tile").dataset.state = state;
  $("statusDot").dataset.state = state;
  $("stateLabel").textContent = state.toUpperCase();
  $("runBtn").disabled = state === "running";
}

/* ---------- run log (localStorage) ---------- */
function loadLog() {
  try {
    const entries = JSON.parse(localStorage.getItem(LOG_KEY));
    return Array.isArray(entries)
      ? entries.filter((e) => e && typeof e === "object" && "time" in e && "summary" in e)
      : [];
  } catch (e) {
    return [];
  }
}
let runlog = loadLog();
function saveLog(entries) {
  try {
    localStorage.setItem(LOG_KEY, JSON.stringify(entries));
  } catch (e) { /* storage blocked — in-memory log still renders this session */ }
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function renderLog() {
  const entries = runlog;
  if (!entries.length) {
    $("runLog").innerHTML = '<div class="empty">No runs yet.</div>';
    return;
  }
  $("runLog").innerHTML = entries.map((e) => (
    '<div class="log-row">' +
      '<span class="log-time">' + escapeHtml(e.time) + '</span>' +
      '<span class="log-dur">' + escapeHtml(e.duration) + 's</span>' +
      '<span class="badge ' + (e.ok ? "ok" : "failed") + '">' + (e.ok ? "OK" : "FAILED") + '</span>' +
      '<span class="log-summary">' + escapeHtml(e.summary) + '</span>' +
    '</div>'
  )).join("");
}
function addEntry(ok, durationMs, summary) {
  runlog.unshift({
    time: new Date().toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit", second: "2-digit" }),
    duration: (durationMs / 1000).toFixed(1),
    ok: ok,
    summary: summary
  });
  runlog = runlog.slice(0, LOG_MAX);
  saveLog(runlog);
  renderLog();
}

/* ---------- run ---------- */
async function fireWebhook() {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
  try {
    const res = await fetch(N8N_WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        loop: LOOP_NAME,
        fired_at: new Date().toISOString(),
        source: "cockpit"
      }),
      signal: ctrl.signal
    });
    if (res.status !== 200) {
      return { ok: false, summary: "HTTP " + res.status + (res.statusText ? " " + res.statusText : "") };
    }
    const raw = await res.text();
    let data = null;
    try { data = JSON.parse(raw); } catch (e) { /* non-JSON 200 */ }
    if (!data || typeof data !== "object") {
      // Receipt contract: the loop must answer {status, summary}. An empty or non-JSON 200 is not proof the loop ran.
      return {
        ok: false,
        summary: raw ? "200 without JSON receipt: " + raw.slice(0, 120) : "200 with empty body — no receipt from loop"
      };
    }
    const failed = typeof data.status === "string" && /^(error|fail|failed)$/i.test(data.status.trim());
    return { ok: !failed, summary: String(data.summary || data.status || "Receipt with no summary").slice(0, 140) };
  } catch (err) {
    return {
      ok: false,
      summary: err.name === "AbortError" ? "Timeout after " + TIMEOUT_MS / 1000 + "s" : "Network error: " + err.message
    };
  } finally {
    clearTimeout(timer);
  }
}

async function runLoop() {
  setState("running");
  const t0 = performance.now();
  let result = { ok: false, summary: "Unexpected error — see console" };
  try {
    if (TEST_MODE) {
      await new Promise((r) => setTimeout(r, 1200));
      result = { ok: true, summary: "TEST — no live loop" };
    } else {
      result = await fireWebhook();
    }
    addEntry(result.ok, performance.now() - t0, result.summary);
  } finally {
    setState(result.ok ? "ok" : "failed");
  }
}

/* ---------- init ---------- */
$("testBanner").classList.toggle("show", TEST_MODE);
$("runBtn").addEventListener("click", runLoop);
renderLog();
</script>
</body>
</html>
