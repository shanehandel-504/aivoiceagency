       site's own money button (.btn-go, DESIGN-SYSTEM § 12). This block only
       lays out one screen: the mark, one line, the button, the number. */
    .try{min-height:100vh;min-height:100dvh;display:flex;margin:0;padding:0}
    .try-wrap{flex:1;width:100%;max-width:1180px;margin:0 auto;

    .try a:focus-visible{outline:2px solid var(--signal-blue);outline-offset:3px}

    /* The block sits a little above the middle of the screen: auto margins
       centre it in the space under the mark, and the bottom padding on the
       wrap is larger than the top so the eye lands on the button. */
    .try-call{margin:auto 0;padding:2rem 0 3rem;display:flex;flex-direction:column;
      align-items:flex-start;gap:2rem;width:100%;max-width:30rem}
    /* Two sentences, two lines, at every width. The break is the markup's. */

      font-size:clamp(1.875rem,1.3rem + 2.4vw,3.25rem);line-height:1.08;

    .try-h span{display:block}
    .try-dial{display:flex;flex-direction:column;align-items:flex-start;gap:1.5rem;width:100%}
    .try-btn{width:100%;max-width:26rem;justify-content:center;text-align:center}
    /* The number is a machine readout, so it takes the mono face (§ 3). It is
       a link too: on a phone it dials, at a desk it is the thing to read out. */
    .try-num{display:inline-flex;align-items:center;min-height:44px;
      font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums;
      font-size:clamp(1.75rem,1.2rem + 2.6vw,2.75rem);line-height:1.1;
      letter-spacing:.02em;color:var(--ink);text-decoration:none;white-space:nowrap;
      border-radius:4px;user-select:all}
    .try-num:hover{color:var(--sky)}
    @media (min-width:768px){
      .try-wrap{padding:2rem 2rem 4rem}
      .try-call{max-width:34rem;gap:2.5rem}
