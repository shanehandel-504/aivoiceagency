<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Trip text card source | AI Chauffeur</title>
<!-- Source of /assets/trip-text-card.jpg, the image on the caller's trip text (MMS) and the trip
     sheet's og:image. Rendered by headless Chromium at 1200x675 and saved as JPG. Words on the card,
     exactly: "AI Chauffeur", "Trip request received", "aichauffeur.ai". The mark is the supplied
     brand/mark-full.svg, referenced and never redrawn or recoloured. Tokens: DESIGN-SYSTEM.md 2. -->
<style>
  @font-face{font-family:'Space Grotesk';src:url('../fonts/space-grotesk.woff2') format('woff2');font-weight:300 700;font-display:block}
  @font-face{font-family:'JetBrains Mono';src:url('../fonts/jetbrains-mono.woff2') format('woff2');font-weight:400 700;font-display:block}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:675px;overflow:hidden;background:#070B14}
  .card{position:relative;width:1200px;height:675px;background:#070B14;color:#E8EDF5;
    padding:60px 80px 56px;display:flex;flex-direction:column}
  .mark{display:block;width:176px;height:176px;margin:-50px 0 -26px -17px}
  .name{margin-top:40px;font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:62px;
    line-height:1.1;letter-spacing:-.01em;color:rgba(232,237,245,.78)}
  .state{display:flex;align-items:center;gap:28px;margin-top:14px}
  .state i{display:block;flex:none;width:16px;height:96px;background:#2EE6A8}
  .state h1{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:96px;line-height:1.05;
    letter-spacing:-.025em;color:#E8EDF5;white-space:nowrap}
  .foot{margin-top:auto;padding-top:26px;border-top:2px solid #1B2536;
    font-family:'JetBrains Mono',monospace;font-weight:500;font-size:46px;letter-spacing:.01em;color:#7FB2FF}
</style>
</head>
<body>
<div class="card">
  <img class="mark" src="brand/mark-full.svg" width="132" height="132" alt="">
  <p class="name">AI Chauffeur</p>
  <div class="state"><i></i><h1>Trip request received</h1></div>
  <p class="foot">aichauffeur.ai</p>
</div>
</body>
</html>
