<style>
  /* ---------------------------------------------------------- TOKENS ---- */
  :root{
    --void:#0A0A0F;
    --line:#23232E;
    --text:#EEF0F4;
    --muted:#7E8299;
    --cyan:#00D4FF;
    /* 4px spacing scale — nothing lands off it */
    --s2:8px; --s4:16px; --s6:24px; --s8:32px; --s12:48px; --s24:96px;
    --wrap:1280px;
    --col:680px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  /* One screen: the header on top, the footer at the bottom, and the call
     block in the middle of whatever height is left. */
  body{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    background:var(--void);
    color:var(--text);
    font-family:'Space Grotesk',system-ui,-apple-system,sans-serif;
    font-weight:400;
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{color:var(--cyan);text-decoration:none;}
  a:hover{text-decoration:underline;}
  /* Focus rings are never removed (§ 3). */
  a:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;}
  .wrap{width:100%;max-width:var(--wrap);margin:0 auto;padding:0 var(--s6);}
  .col{max-width:var(--col);}

  /* ---------------------------------------------------------- HEADER ---- */
  .lhead{border-bottom:1px solid var(--line);background:var(--void);}
  .lhead-in{max-width:var(--wrap);margin:0 auto;padding:var(--s4) var(--s6);display:flex;align-items:center;}
  .lbrand{
    color:var(--text);
    font-weight:700;
    font-size:14px;
    letter-spacing:.14em;
    text-transform:uppercase;
    display:inline-flex;
    align-items:center;
    gap:var(--s2);
    min-height:44px;
  }
  .lbrand:hover{text-decoration:none;color:var(--cyan);}
  .ldot{width:8px;height:8px;background:var(--cyan);display:inline-block;}

  /* ------------------------------------------------------------ CALL ---- */
  main{flex:1;display:flex;align-items:center;}
  .call{width:100%;padding:var(--s12) 0;}
  /* Two sentences, two lines, at every width. The break is the markup's. */
  .call h1{
    font-size:clamp(28px,7.8vw,68px);
    font-weight:700;
    letter-spacing:-.03em;
    line-height:1.04;
  }
  .call h1 span{display:block;}
  .call-dial{margin-top:var(--s8);display:flex;flex-direction:column;align-items:flex-start;gap:var(--s6);}
  /* The one accent on the page. Text on the cyan fill is the void: 11.16:1. */
  .btn-call{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:100%;
    max-width:420px;
    min-height:60px;
    padding:var(--s4) var(--s8);
    background:var(--cyan);
    color:var(--void);
    border:1px solid var(--cyan);
    border-radius:0;
    font-family:inherit;
    font-size:20px;
    font-weight:700;
    letter-spacing:.01em;
    transition:background .18s ease,border-color .18s ease;
  }
  .btn-call:hover{background:#5CE3FF;border-color:#5CE3FF;text-decoration:none;}
  /* The number is a link too: on a phone it dials, at a desk it is the thing
     to read out. Space Grotesk with tabular figures (§ 2 has no second face). */
  .call-num{
    display:inline-flex;
    align-items:center;
    min-height:44px;
    color:var(--text);
    font-size:clamp(30px,8vw,48px);
    font-weight:600;
    letter-spacing:.01em;
    line-height:1.1;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
    user-select:all;
  }
  .call-num:hover{color:var(--cyan);text-decoration:none;}

  /* ---------------------------------------------------------- FOOTER ---- */
  .lfoot{border-top:1px solid var(--line);padding:var(--s8) 0;}
  .lfoot-in{
    max-width:var(--wrap);
    margin:0 auto;
    padding:0 var(--s6);
    display:flex;
    flex-wrap:wrap;
    gap:var(--s4) var(--s6);
    align-items:center;
    justify-content:space-between;
  }
  .lfoot a{color:var(--muted);font-size:14px;}
  .lfoot a:hover{color:var(--cyan);}
  .lfoot-links a{display:inline-flex;align-items:center;min-height:44px;}
  .lfoot .legal{color:var(--muted);font-size:13px;max-width:46em;line-height:1.6;}
  .lfoot-links{display:flex;flex-wrap:wrap;gap:var(--s4);}

  /* ------------------------------------------------------- RESPONSIVE --- */
  @media(min-width:768px){
    .wrap,.lhead-in,.lfoot-in{padding-left:var(--s8);padding-right:var(--s8);}
    .call{padding:var(--s24) 0;}
    .call-dial{margin-top:var(--s12);}
  }
  /* The block keeps the header's left edge at every width: the mark, the
     line, the button, the number and the legal line share one axis. */
  @media(prefers-reduced-motion:reduce){
    .btn-call{transition:none;}
  }
</style>
