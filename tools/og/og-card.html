<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @font-face{
    font-family:'Space Grotesk';
    src:url('../../chauffeur/fonts/space-grotesk.woff2') format('woff2');
    font-weight:300 700; font-display:block;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden;background:#0A0A0F}
  .card{
    position:relative;width:1200px;height:630px;background:#0A0A0F;
    font-family:'Space Grotesk',sans-serif;color:#EEF0F4;
    padding:78px 84px;display:flex;flex-direction:column;justify-content:space-between;
  }
  /* faint grid — same 64px rhythm as the site, masked so it fades at the edges */
  .grid{
    position:absolute;inset:0;
    background-image:linear-gradient(rgba(0,212,255,.055) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(0,212,255,.055) 1px,transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(ellipse at 30% 40%,#000 20%,transparent 78%);
            mask-image:radial-gradient(ellipse at 30% 40%,#000 20%,transparent 78%);
  }
  .glow{
    position:absolute;inset:0;
    background:radial-gradient(circle at 16% 0%,rgba(0,212,255,.13) 0%,transparent 46%);
  }
  .row{position:relative;display:flex;align-items:center;gap:18px}
  .brand{
    font-size:34px;font-weight:700;letter-spacing:.30em;text-transform:uppercase;color:#EEF0F4;
  }
  .pill{
    display:inline-flex;align-items:center;gap:11px;
    font-size:17px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    color:#2EE6A8;border:1px solid rgba(46,230,168,.42);background:rgba(46,230,168,.10);
    padding:11px 20px;border-radius:99px;
  }
  .dot{width:9px;height:9px;border-radius:50%;background:#2EE6A8;box-shadow:0 0 10px #2EE6A8}
  .line{
    position:relative;font-size:66px;font-weight:400;line-height:1.08;letter-spacing:-.022em;
    max-width:20ch;color:#EEF0F4;
  }
  .line em{font-style:italic;color:#00D4FF}
  .rule{position:relative;width:132px;height:3px;background:#00D4FF;margin:0 0 30px}
  .foot{
    position:relative;font-size:25px;font-weight:500;letter-spacing:.06em;color:#8A93A6;
    font-variant-numeric:tabular-nums;
  }
  .foot b{color:#EEF0F4;font-weight:600}
</style></head>
<body>
  <div class="card">
    <div class="grid"></div><div class="glow"></div>

    <div class="row" style="justify-content:space-between">
      <div class="brand">AI Chauffeur</div>
      <div class="pill"><span class="dot"></span>Every call answered</div>
    </div>

    <div>
      <div class="rule"></div>
      <div class="line">The limo answering service that <em>never puts a caller on hold.</em></div>
    </div>

    <div class="foot"><b>(414) 775-0019</b> &nbsp;·&nbsp; aichauffeur.ai</div>
  </div>
</body></html>
